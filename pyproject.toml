[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-grade Multimodal Enterprise RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Enterprise RAG Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.6",
    "minio>=7.2.7",
    "qdrant-client>=1.9.1",
    "opensearch-py>=2.6.0",
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-redis>=4.6.0.20240425",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Ban direct imports of model SDKs outside app/models/providers (Task 0.7)
"google.generativeai".msg = "Direct model SDK imports are strictly forbidden outside app/models/providers/ (ADR-046)"
"google.genai".msg = "Direct model SDK imports are strictly forbidden outside app/models/providers/ (ADR-046)"
"groq".msg = "Direct model SDK imports are strictly forbidden outside app/models/providers/ (ADR-046)"
"openai".msg = "Direct model SDK imports are strictly forbidden outside app/models/providers/ (ADR-046)"

[tool.ruff.lint.per-file-ignores]
# Allow SDK imports strictly within the providers package and tests testing isolation
"app/models/providers/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "structlog.*",
    "tenacity.*",
    "google.generativeai.*",
    "google.genai.*",
    "groq.*",
    "minio.*",
    "opensearchpy.*",
    "qdrant_client.*",
    "pypdf.*",
    "pymupdf.*",
    "fitz.*",
    "docx.*",
    "openpyxl.*",
    "pptx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

