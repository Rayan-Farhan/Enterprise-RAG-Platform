services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (ADR-002) — System of Record
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # Redis 7 (ADR-020, ADR-039) — Cache, Rate Limits, Distributed Locks
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: enterprise_rag_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # RabbitMQ 3 Management (ADR-017) — Celery Message Broker
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: enterprise_rag_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # MinIO S3 (ADR-003) — Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: enterprise_rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: enterprise_rag_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-enterprise-rag-documents};
      exit 0;
      "
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # Qdrant (ADR-007, ADR-009, ADR-010) — Dense & Multimodal Vector Engine
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: enterprise_rag_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # ----------------------------------------------------------------------------
  # OpenSearch 2 (ADR-007, ADR-008) — BM25 Lexical & Neural Sparse Engine
  # ----------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: enterprise_rag_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "plugins.security.disabled=true"  # Disabled for local zero-cost dev (ADR-052)
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

volumes:
  postgres_data:
    name: enterprise_rag_postgres_data
  redis_data:
    name: enterprise_rag_redis_data
  rabbitmq_data:
    name: enterprise_rag_rabbitmq_data
  minio_data:
    name: enterprise_rag_minio_data
  qdrant_data:
    name: enterprise_rag_qdrant_data
  opensearch_data:
    name: enterprise_rag_opensearch_data

networks:
  rag_network:
    name: enterprise_rag_network
    driver: bridge
